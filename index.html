<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ödev Proje Takip</title><style>body{font-family:system-ui;background:#eff5ff;margin:0;color:#183153}header{background:#3175e6;color:white;padding:22px;font-size:23px;font-weight:bold}.wrap{max-width:800px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px #d8e2f1;cursor:pointer}.card b{display:block;margin-top:8px}section{display:none;background:white;border-radius:16px;padding:18px;margin-top:16px}section.active{display:block}input,select,textarea,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd7eb;margin:5px 0;box-sizing:border-box;max-width:100%}button{background:#3175e6;color:white;border:0;cursor:pointer}li{padding:9px;border-bottom:1px solid #e8eef6}small{color:#60748d}.back{background:#edf3fc;color:#2053a4}</style></head><body><header>📚 Ödev Proje Takip</header><div class="wrap"><div id="home"><h2>Merhaba Öğrenci 👋</h2><p>Derslerini, hedeflerini ve başarılarını takip et.</p><div class="cards" id="menu"></div></div><section id="detail"><button class="back" onclick="goHome()">← Ana Sayfa</button><h2 id="heading"></h2><div id="content"></div></section><p><small>Deneme sürümü • Bilgiler yalnızca bu tarayıcıda saklanır. Tarayıcı verilerini silersen kayıtlar kaybolabilir.</small></p></div><script>const categories=[['🏠','Ana Sayfa'],['📖','Ödevlerim'],['📁','Projelerim'],['📅','Ders Programım'],['🎯','Hedeflerim'],['🏆','Yarışmalarım'],['📝','Yazılı ve Sözlü Notlarım'],['🗓️','Takvim'],['🔔','Bildirimler'],['⚙️','Ayarlar']];let active='';const menu=document.getElementById('menu');categories.slice(1).forEach(([ico,name])=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<span style="font-size:30px">${ico}</span><b>${name}</b>`;el.onclick=()=>openPage(name);menu.append(el)});function getData(k){try{return JSON.parse(localStorage.getItem('opt_'+k)||'[]')}catch{return []}}function saveData(k,v){localStorage.setItem('opt_'+k,JSON.stringify(v))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goHome(){document.getElementById('home').style.display='block';document.getElementById('detail').classList.remove('active')}function openPage(name){active=name;document.getElementById('home').style.display='none';document.getElementById('detail').classList.add('active');document.getElementById('heading').textContent=name;render()}function render(){let c=document.getElementById('content'),items=getData(active);if(active==='Ayarlar'){c.innerHTML='<p>Bu sürümde kayıtlar cihazın tarayıcısında tutulur.</p><button id="export">Verileri JSON olarak yedekle</button>';document.getElementById('export').onclick=()=>{const data={};categories.forEach(x=>data[x[1]]=getData(x[1]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='odev_proje_yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};return}if(active==='Takvim'||active==='Bildirimler'){const all=categories.slice(1,7).flatMap(x=>getData(x[1]).map(y=>({...y,section:x[1]}))).filter(x=>x.date);all.sort((a,b)=>a.date.localeCompare(b.date));const now=new Date();now.setHours(0,0,0,0);let filtered=active==='Bildirimler'?all.filter(x=>{let days=Math.round((new Date(x.date+'T00:00:00')-now)/86400000);return days>=0&&days<=10}):all;c.innerHTML=filtered.length?'<ul>'+filtered.map(x=>`<li>${esc(x.date)} — ${esc(x.title)} <small>(${esc(x.section)})</small></li>`).join('')+'</ul>':'<p>Henüz tarihli kayıt yok.</p>';return}let type=active==='Yazılı ve Sözlü Notlarım';c.innerHTML=`<form id="entry"><input name="title" placeholder="${type?'Ders adı':active==='Ders Programım'?'Ders adı':'Başlık / ders'}" required><br>${active==='Ders Programım'?'<select name="day"><option>Pazartesi</option><option>Salı</option><option>Çarşamba</option><option>Perşembe</option><option>Cuma</option></select><input name="time" type="time">':type?'<select name="kind"><option>Yazılı</option><option>Sözlü</option></select><input name="target" type="number" min="0" max="100" placeholder="Hedef not" required><input name="score" type="number" min="0" max="100" placeholder="Alınan not" required>':`<input name="date" type="date">${active==='Hedeflerim'?'<input name="target" type="number" min="1" placeholder="Hedef miktarı (örn. 50)"><input name="score" type="number" min="0" placeholder="Yapılan miktar (örn. 30)">':''}`}<br><textarea name="note" placeholder="Açıklama (isteğe bağlı)"></textarea><br><button type="submit">+ Kaydet</button></form><h3>Kayıtlarım</h3><div id="records"></div>`;document.getElementById('entry').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.id=Date.now()+Math.random();saveData(active,[...getData(active),data]);render()};let r=document.getElementById('records');r.innerHTML=items.length?'<ul>'+items.map(x=>{let extra=type?` • ${esc(x.kind)}: hedef ${esc(x.target)}, alınan ${esc(x.score)} (${Number(x.score)-Number(x.target)>=0?'+':''}${Number(x.score)-Number(x.target)} puan)`:active==='Hedeflerim'&&x.target?` • ${esc(x.score||0)}/${esc(x.target)} (${Math.round(100*Number(x.score||0)/Number(x.target))}%)`:active==='Ders Programım'?` • ${esc(x.day||'')} ${esc(x.time||'')}`:x.date?` • ${esc(x.date)}`:'';return `<li><b>${esc(x.title)}</b>${extra}<br><small>${esc(x.note||'')}</small> <button data-id="${x.id}" class="remove">Sil</button></li>`}).join('')+'</ul>':'<p>Henüz kayıt yok. Yukarıdan ekleyebilirsin.</p>';r.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{saveData(active,getData(active).filter(x=>String(x.id)!==b.dataset.id));render()})}</script></body></html>
